<title>Трекер объявлений аренды</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: шапка с вкладками-счётчиками, затем простой список объектов: слева объект и ставка, справа две задачи с кнопками; подробности свёрнуты */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#eceee9; --line:#d9ddd5;
  --fg:#1d2420; --muted:#66716a; --accent:#1f6b52; --accent-fg:#ffffff; --accent-soft:#dcefe6;
  --late:#b3361f; --late-soft:#f8e1db; --due:#9a6400; --due-soft:#f6ebd2; --ok:#2c7a4b; --ok-soft:#ddf0e3;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151a17; --surface:#1d2420; --sunk:#232b26; --line:#34403a;
  --fg:#e7ece8; --muted:#9aa79f; --accent:#5fc49b; --accent-fg:#0e1a14; --accent-soft:#1f3a2f;
  --late:#ff8a73; --late-soft:#3d2320; --due:#e7b04f; --due-soft:#3a2f1a; --ok:#79d39a; --ok-soft:#1d3426; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a17; --surface:#1d2420; --sunk:#232b26; --line:#34403a;
  --fg:#e7ece8; --muted:#9aa79f; --accent:#5fc49b; --accent-fg:#0e1a14; --accent-soft:#1f3a2f;
  --late:#ff8a73; --late-soft:#3d2320; --due:#e7b04f; --due-soft:#3a2f1a; --ok:#79d39a; --ok-soft:#1d3426; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:700}
.h-actions{display:flex;gap:8px;flex-wrap:wrap}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
button.ghost:hover{color:var(--fg)}
button.danger{color:var(--late)}
button:disabled{opacity:.45;cursor:default}
.notice{background:var(--due-soft);border-radius:8px;padding:10px 14px;font-size:14px}
.toast{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:14px}
/* Вкладки */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;border-radius:0;background:transparent;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.count{font-family:var(--f-num);font-size:12px;background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 8px}
.count.hot{background:var(--late-soft);color:var(--late)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}
#search{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:240px;max-width:100%;min-width:0}
/* Список */
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px 20px;align-items:start}
.r-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.r-title{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.r-title a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
.r-price{font-family:var(--f-num);font-size:20px;font-weight:600;line-height:1.2}
.r-price small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.r-sub{color:var(--muted);font-size:13px}
.tasks{display:flex;flex-direction:column;gap:8px;min-width:0}
.task{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--sunk);border-radius:8px;padding:8px 8px 8px 12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.dot.late{background:var(--late)} .dot.due{background:var(--due)} .dot.off{background:var(--line)}
.task b{display:block;font-weight:500;font-size:14px;overflow-wrap:anywhere}
.task small{display:block;font-size:13px;color:var(--muted)}
.task small.late{color:var(--late);font-weight:600} .task small.due{color:var(--due);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
details.more{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";transition:transform .15s}
details.more[open] summary::before{transform:rotate(90deg)}
.more-body{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px;margin:0}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-num);font-weight:600}
.advice{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.hist{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.m-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.confirm{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted)}
.copybox{width:100%;min-height:140px;font:13px/1.5 var(--f-num)}
/* Форма */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,20,15,.45)}
form.f{padding:20px;display:flex;flex-direction:column;gap:14px}
form.f h2{margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.wide{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:56px;resize:vertical}
details.set{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.set summary{cursor:pointer;font-size:14px}
details.set summary span{color:var(--muted);font-size:13px}
details.set .grid{padding-top:12px}
.preview{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.preview ol{margin:4px 0 0;padding-left:20px}
.f-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--late);font-size:13px}
@media (max-width:680px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Объявления аренды</h1>
    <div class="h-actions">
      <button type="button" id="copyBtn">Сводка для Telegram</button>
      <button class="primary" id="addBtn" type="button">+ Новый объект</button>
    </div>
  </header>

  <div id="storeNote" class="notice" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <nav class="tabs" aria-label="Разделы">
    <button type="button" data-f="todo" aria-pressed="true">Сегодня <span class="count" id="cTodo">0</span></button>
    <button type="button" data-f="active" aria-pressed="false">Активные <span class="count" id="cActive">0</span></button>
    <button type="button" data-f="archive" aria-pressed="false">Архив <span class="count" id="cArchive">0</span></button>
  </nav>
  <div class="toolbar">
    <span id="tabHint">Задачи, которые нужно сделать сегодня или уже просрочены.</span>
    <input id="search" type="search" placeholder="Поиск по адресу или сотруднику" aria-label="Поиск">
  </div>

  <section class="list" id="list" aria-live="polite">
    <div class="empty">Загружаю объекты…</div>
  </section>
</div>

<dialog id="dlg">
  <form class="f" id="form" novalidate>
    <h2 id="fTitle">Новый объект</h2>
    <div class="grid">
      <label class="wide">Адрес или название<input id="f_title" required placeholder="ул. Ленина 12, помещение 3"></label>
      <label>Дата размещения<input id="f_pub" type="date" required></label>
      <label>Полная ставка, ₽/мес<input id="f_rent" type="number" min="0" step="1000" required></label>
      <label>Ответственный<input id="f_resp" placeholder="Имя сотрудника"></label>
      <label>Текущая скидка, %<input id="f_disc" type="number" min="0" max="100" step="0.5"></label>
      <label class="wide">Ссылка на объявление<input id="f_link" type="url" placeholder="https://…"></label>
    </div>
    <details class="set" id="setBox">
      <summary>Настройки напоминаний <span id="setSum"></span></summary>
      <div class="grid">
        <label>Обновлять объявление каждые, дней<input id="f_refEvery" type="number" min="1" step="1"></label>
        <label>Последнее обновление<input id="f_refLast" type="date"></label>
        <label>Снижать ставку каждые, дней<input id="f_stepDays" type="number" min="1" step="1"></label>
        <label>Шаг снижения, %<input id="f_stepPct" type="number" min="0.5" max="100" step="0.5"></label>
        <label>Максимальная скидка, %<input id="f_maxPct" type="number" min="0" max="100" step="1"></label>
        <label>Срок скидки по договору, мес<input id="f_term" type="number" min="1" step="1"></label>
      </div>
    </details>
    <label>Комментарий<textarea id="f_note" placeholder="Особенности объекта, договорённости с собственником"></textarea></label>
    <div class="preview" id="fPreview"></div>
    <div class="err" id="fErr" hidden></div>
    <div class="f-actions">
      <button type="button" class="ghost" id="fCancel">Отмена</button>
      <button type="submit" class="primary" id="fSave">Сохранить</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const DEF = { refEvery: 3, stepDays: 14, stepPct: 5, maxPct: 30, term: 11 };
  const DAYS_IN_MONTH = 30.4;
  const LS_KEY = 'arenda-tracker-v1';
  const $ = s => document.querySelector(s);
  const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
  const pct = n => (Math.round(n * 10) / 10).toLocaleString('ru-RU') + '%';
  const mon = n => (Math.round(n * 10) / 10).toLocaleString('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  // --- даты (локальные, без времени) ---
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const todayISO = () => iso(new Date());
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5); // b - a, дни
  const fmtDate = s => parse(s).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  function plural(n, one, few, many) { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; if (b === 1) return one; return many; }
  const dn = n => `${n} ${plural(n, 'день', 'дня', 'дней')}`;
  const whenText = d => d < 0 ? `просрочено на ${dn(-d)}` : d === 0 ? 'сегодня' : d === 1 ? 'завтра' : `через ${dn(d)}`;
  const level = d => d < 0 ? 'late' : d <= 1 ? 'due' : 'ok';

  // --- расчёт по объекту ---
  function calc(o) {
    const t = todayISO();
    const end = o.status === 'archived' && o.closedAt ? o.closedAt : t;
    const daysOn = Math.max(0, diff(o.publishedAt, end));
    const idleMonths = daysOn / DAYS_IN_MONTH;
    const disc = o.discountPct;
    const refNext = addDays(o.lastRefreshAt || o.publishedAt, o.refreshEvery);
    const redNext = addDays(o.lastReduceAt || o.publishedAt, o.stepDays);
    const atMax = disc >= o.maxPct;
    const nextDisc = Math.min(o.maxPct, disc + o.stepPct);
    return {
      daysOn, idleMonths, disc, refNext, redNext, atMax, nextDisc,
      curRent: o.fullRent * (1 - disc / 100),
      refIn: diff(t, refNext), redIn: diff(t, redNext),
      nextRent: o.fullRent * (1 - nextDisc / 100),
      idleLoss: o.fullRent * idleMonths,
      // из таблицы: безубыточный простой X = скидка × срок скидки Y
      breakEvenNext: nextDisc / 100 * o.term,
      discTotalNext: o.fullRent * nextDisc / 100 * o.term,
      equivDisc: Math.min(100, idleMonths / o.term * 100),
    };
  }
  const needsAction = (o, c) => o.status === 'active' && (c.refIn <= 0 || (!c.atMax && c.redIn <= 0));
  const urgency = (o, c) => Math.min(c.refIn, c.atMax ? 1e5 : c.redIn);

  // --- проверка данных из общей базы: туда может писать любой участник, поэтому всё приводим к ожидаемым типам ---
  const okDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(parse(v)) ? v : null;
  const numIn = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };
  const str = (v, max) => typeof v === 'string' ? v.slice(0, max) : '';
  const safeUrl = v => { if (typeof v !== 'string' || !v) return ''; try { const u = new URL(v); return u.protocol === 'https:' || u.protocol === 'http:' ? u.href : ''; } catch (e) { return ''; } };
  function normalize(id, d) {
    const pub = okDate(d && d.publishedAt);
    if (!pub || typeof id !== 'string' || !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)) return null;
    // старые записи со статусом «rented» переезжают в архив
    const legacyRented = d.status === 'rented';
    const archived = d.status === 'archived' || legacyRented;
    return {
      id, title: str(d.title, 200) || 'Без названия', link: safeUrl(d.link), publishedAt: pub,
      fullRent: numIn(d.fullRent, 0, 1e9, 0), resp: str(d.resp, 100),
      refreshEvery: Math.round(numIn(d.refreshEvery, 1, 365, DEF.refEvery)), lastRefreshAt: okDate(d.lastRefreshAt),
      stepDays: Math.round(numIn(d.stepDays, 1, 365, DEF.stepDays)), stepPct: numIn(d.stepPct, 0.5, 100, DEF.stepPct),
      maxPct: numIn(d.maxPct, 0, 100, DEF.maxPct), discountPct: numIn(d.discountPct, 0, 100, 0),
      term: Math.round(numIn(d.term, 1, 120, DEF.term)), note: str(d.note, 1000),
      status: archived ? 'archived' : 'active',
      outcome: legacyRented ? 'rented' : (d.outcome === 'rented' || d.outcome === 'withdrawn' ? d.outcome : null),
      closedAt: okDate(d.closedAt) || okDate(d.rentedAt),
      lastReduceAt: okDate(d.lastReduceAt), createdAt: okDate(d.createdAt),
      history: Array.isArray(d.history) ? d.history.filter(h => h && okDate(h.d)).slice(0, 40)
        .map(h => ({ d: h.d, text: str(h.text, 300), by: str(h.by, 64) })) : [],
    };
  }

  // --- хранилище: общая база артефакта, иначе localStorage этого браузера ---
  let items = [];
  let store = null;
  let canWrite = true, canDelete = true;
  let uid = '', userApi = null;
  const names = {}; const asked = new Set();
  let skipped = 0;
  let filter = 'todo', q = '';
  try { const f = localStorage.getItem(LS_KEY + ':tab'); if (['todo', 'active', 'archive'].includes(f)) filter = f; } catch (e) {}

  function localStore() {
    const read = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; } };
    const write = arr => { try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch (e) {} };
    const raw = read();
    items = (Array.isArray(raw) ? raw : []).map(d => normalize(d && d.id, d)).filter(Boolean);
    return {
      async save(o) { const i = items.findIndex(x => x.id === o.id); if (i >= 0) items[i] = o; else items.push(o); write(items); render(); },
      async patch(id, p) { const o = items.find(x => x.id === id); if (o) Object.assign(o, p); write(items); render(); },
      async remove(id) { items = items.filter(x => x.id !== id); write(items); render(); },
    };
  }

  async function init() {
    let db = null;
    try { db = await (window.claude?.use ? window.claude.use('db') : null); } catch (e) { db = null; }
    if (!db) {
      store = localStore();
      note('Общая база недоступна в этом просмотре: данные сохраняются только в этом браузере. Откройте ссылку claude.ai, войдя в аккаунт.');
      render();
      return;
    }
    canDelete = false;
    try {
      const user = await window.claude.use('user');
      userApi = user;
      if (user) {
        if (await user.can('data.write') === false) canWrite = false;
        canDelete = await user.canEdit();
        uid = (await user.id()) || '';
      }
    } catch (e) {}
    const col = db.collection('listings');
    col.onSnapshot(snap => {
      const all = snap.docs.map(d => normalize(d.id, d.data()));
      items = all.filter(Boolean);
      skipped = all.length - items.length;
      render();
    }, () => note('Связь с общей базой прервалась. Обновите страницу.'));
    const fail = e => {
      if (e && e.code === 'invalid_argument') { canWrite = false; render(); note('Нет прав на изменение. Попросите владельца выдать доступ «Участник» или выше.'); }
      else if (e && e.code === 'quota_exceeded') note('База заполнена: удалите старые записи из архива.');
      else note('Не удалось сохранить. Повторите через несколько секунд.');
      throw e;
    };
    store = {
      async save(o) { const { id, ...body } = o; try { await col.doc(id).set(body); } catch (e) { fail(e); } },
      // действия меняют только свои поля, чтобы не затирать правки коллег
      async patch(id, p) { try { await col.doc(id).update(p); } catch (e) { fail(e); } },
      async remove(id) { try { await col.doc(id).delete(); } catch (e) { note('Не удалось удалить.'); } },
    };
    if (!canWrite) note('У вас доступ только на просмотр: отмечать действия и добавлять объекты нельзя.');
    render();
  }
  function note(msg) { const n = $('#storeNote'); n.textContent = msg; n.hidden = false; }
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4000); }

  // --- действия ---
  const entry = text => ({ d: todayISO(), text, by: uid });
  async function act(id, kind) {
    const o = items.find(x => x.id === id); if (!o) return;
    const c = calc(o); const t = todayISO(); const p = {};
    const h = text => { p.history = [entry(text), ...o.history].slice(0, 40); };
    if (kind === 'refresh') { p.lastRefreshAt = t; h('Объявление обновлено'); }
    if (kind === 'reduce') { p.discountPct = c.nextDisc; p.lastReduceAt = t; h(`Ставка снижена до ${rub(c.nextRent)} (скидка ${pct(c.nextDisc)})`); }
    if (kind === 'skip') { p.lastReduceAt = t; h(`Снижение отложено на ${dn(o.stepDays)}`); }
    if (kind === 'rented') { p.status = 'archived'; p.outcome = 'rented'; p.closedAt = t; h(`Сдано за ${rub(c.curRent)}, срок поиска ${dn(c.daysOn)}`); }
    if (kind === 'withdrawn') { p.status = 'archived'; p.outcome = 'withdrawn'; p.closedAt = t; h(`Снято с публикации через ${dn(c.daysOn)}`); }
    if (kind === 'reopen') { p.status = 'active'; p.outcome = null; p.closedAt = null; h('Возвращено в активные'); }
    if (!p.history) return;
    await store.patch(id, p);
    if (kind === 'rented' || kind === 'withdrawn') toast('Перенесено в архив.');
  }
  async function resolveNames(ids) {
    const need = ids.filter(i => i && !asked.has(i)); if (!need.length || !userApi) return;
    need.forEach(i => asked.add(i));
    try {
      const ps = await userApi.profiles(need.slice(0, 64));
      let changed = false;
      need.forEach(i => { const n = ps && ps[i] && ps[i].name; if (n) { names[i] = n; changed = true; } });
      if (changed) render();
    } catch (e) {}
  }

  // --- отрисовка ---
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const dis = () => canWrite ? '' : 'disabled';
  const HINTS = {
    todo: 'Задачи, которые нужно сделать сегодня или уже просрочены.',
    active: 'Все объявления в работе, сначала самые срочные.',
    archive: 'Завершённые объявления: сданные и снятые с публикации.',
  };

  function render() {
    const all = items.map(o => ({ o, c: calc(o) }));
    const active = all.filter(r => r.o.status === 'active');
    const todo = active.filter(r => needsAction(r.o, r.c));
    const archive = all.filter(r => r.o.status === 'archived');
    $('#cTodo').textContent = todo.length; $('#cTodo').classList.toggle('hot', todo.length > 0);
    $('#cActive').textContent = active.length; $('#cArchive').textContent = archive.length;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === filter)));
    $('#tabHint').textContent = HINTS[filter];
    $('#addBtn').disabled = !canWrite;

    let rows = filter === 'todo' ? todo : filter === 'active' ? active : archive;
    if (q) rows = rows.filter(r => (r.o.title + ' ' + r.o.resp).toLowerCase().includes(q));
    if (filter === 'archive') rows.sort((a, b) => (b.o.closedAt || '').localeCompare(a.o.closedAt || ''));
    else rows.sort((a, b) => urgency(a.o, a.c) - urgency(b.o, b.c));

    const list = $('#list');
    const warn = skipped ? `<div class="notice">Пропущено повреждённых записей: ${skipped}. Они не показываются, пока в них нет корректной даты размещения.</div>` : '';
    if (!items.length) { list.innerHTML = `<div class="empty">Объектов пока нет. Нажмите «+ Новый объект», укажите дату размещения и ставку. Даты обновления и снижения трекер посчитает сам.</div>`; return; }
    if (!rows.length) {
      const msg = q ? 'Ничего не найдено.' : filter === 'todo' ? 'На сегодня всё сделано. Ближайшие задачи есть во вкладке «Активные».' : filter === 'archive' ? 'В архиве пока пусто. Объявление попадает сюда после кнопки «Завершить».' : 'Активных объявлений нет.';
      list.innerHTML = warn + `<div class="empty">${msg}</div>`; return;
    }
    list.innerHTML = warn + rows.map(({ o, c }) => o.status === 'archived' ? archRow(o, c) : row(o, c)).join('');
    resolveNames([...new Set(rows.flatMap(r => r.o.history.map(x => x.by)))]);
  }

  const titleHtml = o => o.link ? `<a href="${esc(o.link)}" target="_blank" rel="noopener noreferrer">${esc(o.title)}</a>` : esc(o.title);

  function row(o, c) {
    const priceSub = c.disc ? `<small>скидка ${pct(c.disc)} от ${rub(o.fullRent)}</small>` : '<small>полная ставка</small>';
    const refT = `<div class="task"><span class="dot ${level(c.refIn)}"></span>
      <div><b>Обновить объявление</b><small class="${level(c.refIn)}">${whenText(c.refIn)}${c.refIn > 0 ? ', ' + fmtDate(c.refNext) : ''}</small></div>
      <button type="button" data-a="refresh" data-id="${o.id}" ${dis()}>Обновил</button></div>`;
    const redT = c.atMax
      ? `<div class="task"><span class="dot off"></span><div><b>Скидка на максимуме (${pct(o.maxPct)})</b><small>Дальше снижать только по решению руководителя</small></div><span></span></div>`
      : `<div class="task"><span class="dot ${level(c.redIn)}"></span>
        <div><b>Снизить до <span class="num">${rub(c.nextRent)}</span></b><small class="${level(c.redIn)}">${whenText(c.redIn)}${c.redIn > 0 ? ', ' + fmtDate(c.redNext) : ''}</small></div>
        <button type="button" data-a="reduce" data-id="${o.id}" ${dis()}>Снизил</button></div>`;
    const advice = c.atMax ? '' : `<div class="advice">Следующая скидка ${pct(c.nextDisc)} на ${o.term} мес. обойдётся в <b class="num">${rub(c.discTotalNext)}</b>. Она выгодна, если без неё объект простоит ещё больше <b class="num">${mon(c.breakEvenNext)} мес.</b></div>`;
    return `<article class="row">
      <div class="r-main">
        <h2 class="r-title">${titleHtml(o)}</h2>
        <div class="r-price">${rub(c.curRent)}${priceSub}</div>
        <div class="r-sub">На сайте ${dn(c.daysOn)}${o.resp ? ' · ' + esc(o.resp) : ''}</div>
      </div>
      <div class="tasks">${refT}${redT}</div>
      <details class="more"><summary>Подробнее</summary><div class="more-body">
        ${advice}
        <dl class="facts">
          <div><dt>Размещено</dt><dd>${fmtDate(o.publishedAt)}</dd></div>
          <div><dt>Потеряно на простое</dt><dd>${rub(c.idleLoss)}</dd></div>
          <div><dt>Это равно скидке на ${o.term} мес.</dt><dd>${pct(c.equivDisc)}</dd></div>
          <div><dt>График</dt><dd>−${pct(o.stepPct)} каждые ${dn(o.stepDays)}</dd></div>
        </dl>
        ${o.note ? `<div class="r-sub">${esc(o.note)}</div>` : ''}
        ${hist(o)}
        <div class="m-actions">
          ${c.atMax ? '' : `<button type="button" class="ghost" data-a="skip" data-id="${o.id}" ${dis()}>Отложить снижение</button>`}
          <button type="button" class="ghost" data-a="edit" data-id="${o.id}" ${dis()}>Изменить</button>
          <span class="confirm" data-box="${o.id}"><button type="button" data-a="finish" data-id="${o.id}" ${dis()}>Завершить…</button></span>
          ${delBtn(o)}
        </div>
      </div></details>
    </article>`;
  }

  function archRow(o, c) {
    const out = o.outcome === 'rented' ? '<span class="pill ok">Сдано</span>' : o.outcome === 'withdrawn' ? '<span class="pill">Снято с публикации</span>' : '<span class="pill">Завершено</span>';
    return `<article class="row">
      <div class="r-main">
        <h2 class="r-title">${titleHtml(o)}</h2>
        <div class="r-price">${rub(c.curRent)}${c.disc ? `<small>скидка ${pct(c.disc)}</small>` : ''}</div>
        <div class="r-sub">${o.resp ? esc(o.resp) : ''}</div>
      </div>
      <div class="tasks"><div class="task"><span class="dot off"></span>
        <div><b>${out}</b><small>${o.closedAt ? fmtDate(o.closedAt) + ' · ' : ''}поиск занял ${dn(c.daysOn)}</small></div><span></span></div></div>
      <details class="more"><summary>Подробнее</summary><div class="more-body">
        <dl class="facts">
          <div><dt>Размещено</dt><dd>${fmtDate(o.publishedAt)}</dd></div>
          <div><dt>Полная ставка</dt><dd>${rub(o.fullRent)}</dd></div>
          <div><dt>Потеря на простое</dt><dd>${rub(c.idleLoss)}</dd></div>
        </dl>
        ${o.note ? `<div class="r-sub">${esc(o.note)}</div>` : ''}
        ${hist(o)}
        <div class="m-actions">
          <button type="button" class="ghost" data-a="reopen" data-id="${o.id}" ${dis()}>Вернуть в активные</button>
          ${delBtn(o)}
        </div>
      </div></details>
    </article>`;
  }

  const delBtn = o => canDelete ? `<span class="confirm" data-del="${o.id}"><button type="button" class="ghost danger" data-a="del" data-id="${o.id}" ${dis()}>Удалить</button></span>` : '';
  function hist(o) {
    if (!o.history.length) return '';
    return `<ul class="hist">${o.history.map(x => `<li><span class="num">${fmtDate(x.d)}</span>: ${esc(x.text)}${x.by && names[x.by] ? ` (${esc(names[x.by])})` : ''}</li>`).join('')}</ul>`;
  }

  // --- сводка для Telegram ---
  function digest() {
    const lines = [];
    items.filter(o => o.status === 'active').map(o => ({ o, c: calc(o) })).filter(r => needsAction(r.o, r.c))
      .sort((a, b) => urgency(a.o, a.c) - urgency(b.o, b.c))
      .forEach(({ o, c }) => {
        const t = [];
        if (c.refIn <= 0) t.push(`обновить объявление (${whenText(c.refIn)})`);
        if (!c.atMax && c.redIn <= 0) t.push(`снизить ставку до ${rub(c.nextRent)} (${whenText(c.redIn)})`);
        lines.push(`• ${o.title}${o.resp ? ' [' + o.resp + ']' : ''}: ${t.join('; ')}`);
      });
    const head = `Аренда: задачи на ${parse(todayISO()).toLocaleDateString('ru-RU')}`;
    return lines.length ? `${head}\n${lines.join('\n')}` : `${head}\nПросроченных задач нет.`;
  }
  $('#copyBtn').addEventListener('click', () => {
    const text = digest();
    const fallback = () => {
      const t = $('#toast'); clearTimeout(toastT); t.hidden = false;
      t.innerHTML = '<div>Скопируйте текст вручную:</div>';
      const ta = document.createElement('textarea'); ta.className = 'copybox'; ta.readOnly = true; ta.value = text;
      t.appendChild(ta); ta.focus(); ta.select();
    };
    try { navigator.clipboard.writeText(text).then(() => toast('Сводка скопирована. Вставьте её в чат Telegram.'), fallback); } catch (e) { fallback(); }
  });

  // --- обработчики ---
  $('#list').addEventListener('click', async e => {
    const b = e.target.closest('button[data-a]'); if (!b || b.disabled) return;
    const { a, id } = b.dataset;
    if (a === 'edit') return openForm(items.find(x => x.id === id));
    if (a === 'finish') {
      document.querySelector(`[data-box="${id}"]`).innerHTML = `Итог: <button type="button" class="primary" data-a="rented" data-id="${id}">Сдано</button><button type="button" data-a="withdrawn" data-id="${id}">Снято с публикации</button><button type="button" class="ghost" data-a="cancel" data-id="${id}">Отмена</button>`;
      return;
    }
    if (a === 'del') {
      document.querySelector(`[data-del="${id}"]`).innerHTML = `Удалить навсегда? <button type="button" class="danger" data-a="delyes" data-id="${id}">Да, удалить</button><button type="button" class="ghost" data-a="cancel" data-id="${id}">Нет</button>`;
      return;
    }
    if (a === 'cancel') return render();
    if (a === 'delyes') return canDelete ? store.remove(id) : undefined;
    b.disabled = true;
    try { await act(id, a); } catch (err) { b.disabled = false; }
  });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f; try { localStorage.setItem(LS_KEY + ':tab', filter); } catch (e) {} render();
  }));
  $('#search').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });

  // --- форма ---
  const dlg = $('#dlg'); let editing = null;
  const F = id => $('#f_' + id);
  function openForm(o) {
    editing = o || null;
    $('#fTitle').textContent = o ? 'Изменить объект' : 'Новый объект';
    $('#fErr').hidden = true;
    F('title').value = o?.title || ''; F('link').value = o?.link || '';
    F('pub').value = o?.publishedAt || todayISO(); F('rent').value = o?.fullRent ?? '';
    F('resp').value = o?.resp || ''; F('disc').value = o?.discountPct ?? 0;
    F('refEvery').value = o?.refreshEvery ?? DEF.refEvery; F('refLast').value = o?.lastRefreshAt || '';
    F('stepDays').value = o?.stepDays ?? DEF.stepDays; F('stepPct').value = o?.stepPct ?? DEF.stepPct;
    F('maxPct').value = o?.maxPct ?? DEF.maxPct; F('term').value = o?.term ?? DEF.term; F('note').value = o?.note || '';
    $('#setBox').open = false;
    preview();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    F('title').focus();
  }
  function closeForm() { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
  function preview() {
    const rent = +F('rent').value, step = +F('stepPct').value, max = +F('maxPct').value, term = +F('term').value, days = +F('stepDays').value, ref = +F('refEvery').value;
    $('#setSum').textContent = `· обновлять раз в ${dn(ref || DEF.refEvery)}, снижать на ${pct(step || DEF.stepPct)} раз в ${dn(days || DEF.stepDays)}`;
    if (!rent || !step || !term || !days) { $('#fPreview').textContent = 'Укажите ставку, и здесь появится график снижения.'; return; }
    const steps = []; let d = +F('disc').value || 0, k = 0;
    while (d < max && k < 6) { d = Math.min(max, d + step); k++; steps.push(`<li>через ${dn(days * k)}: <b class="num">${rub(rent * (1 - d / 100))}</b> (скидка ${pct(d)})</li>`); }
    $('#fPreview').innerHTML = steps.length ? 'График снижения ставки:<ol>' + steps.join('') + '</ol>' : 'Скидка уже на максимуме, снижений не будет.';
  }
  $('#form').addEventListener('input', preview);
  $('#addBtn').addEventListener('click', () => openForm(null));
  $('#fCancel').addEventListener('click', closeForm);
  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    const err = m => { $('#fErr').textContent = m; $('#fErr').hidden = false; };
    const title = F('title').value.trim(), rent = +F('rent').value, pub = F('pub').value;
    if (!title) return err('Укажите адрес или название объекта.');
    if (!okDate(pub)) return err('Укажите дату размещения объявления.');
    if (!(rent > 0)) return err('Укажите полную ставку больше нуля.');
    const o = {
      ...(editing ? structuredClone(editing) : { id: 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), status: 'active', history: [], createdAt: todayISO() }),
      title, link: F('link').value.trim(), publishedAt: pub, fullRent: rent, resp: F('resp').value.trim(),
      refreshEvery: F('refEvery').value, lastRefreshAt: F('refLast').value || null,
      stepDays: F('stepDays').value, stepPct: F('stepPct').value, maxPct: F('maxPct').value,
      discountPct: F('disc').value, term: F('term').value, note: F('note').value.trim(),
    };
    const clean = normalize(o.id, o);
    const now = rub(clean.fullRent * (1 - clean.discountPct / 100));
    if (!editing) clean.history = [entry(`Объявление размещено, ставка ${now}`)];
    else if (editing.fullRent !== clean.fullRent || editing.discountPct !== clean.discountPct) clean.history = [entry(`Ставка изменена вручную: ${now}`), ...clean.history].slice(0, 40);
    $('#fSave').disabled = true;
    try { await store.save(clean); closeForm(); toast(editing ? 'Изменения сохранены.' : 'Объект добавлен.'); }
    catch (x) { err('Не удалось сохранить, попробуйте ещё раз.'); }
    finally { $('#fSave').disabled = false; }
  });

  setInterval(render, 60 * 60 * 1000); // пересчитать «сегодня» после полуночи
  init();
})();
</script>
